name: Deploy collaboration graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the static site
        uses: actions/checkout@3d3c42e5aac5ba805825c4a0d16c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Check whether scheduled data are new
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          available_revision=$(node scripts/build-site.js --revision-only)
          deployed_revision=$(
            curl --silent --show-error --max-time 15 \
              https://cmccomb.github.io/map-of-collaboration/map-config.json 2>/dev/null |
              node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try { process.stdout.write(JSON.parse(input).dataset_revision || ""); }
                  catch { process.stdout.write(""); }
                });
              ' || true
          )
          if [ "$available_revision" = "$deployed_revision" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "The deployed site already uses $available_revision"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project metadata
        if: steps.freshness.outputs.deploy == 'true'
        run: npm ci

      - name: Check JavaScript syntax
        if: steps.freshness.outputs.deploy == 'true'
        run: npm run check

      - name: Run unit and data-contract tests
        if: steps.freshness.outputs.deploy == 'true'
        run: npm test

      - name: Build the pinned static site
        if: steps.freshness.outputs.deploy == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
